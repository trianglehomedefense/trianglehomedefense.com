<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 499" role="img" aria-labelledby="title desc">
  <title id="title">Triangle Home Defense logo</title>
  <desc id="desc">Weathered Triangle Home Defense logo in garnet, charcoal, and stone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#11100f"/>
      <stop offset="1" stop-color="#261414"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efe3cf"/>
      <stop offset="1" stop-color="#b9a78d"/>
    </linearGradient>
    <linearGradient id="garnet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8f3030"/>
      <stop offset="1" stop-color="#4f161b"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="620" height="499" fill="url(#bg)"/>
  <rect width="620" height="499" filter="url(#grain)"/>

  <g transform="translate(36 48)">
    <path d="M116 118 L202 42 L288 118 L288 214 L116 214 Z" fill="#0d0c0c" stroke="url(#garnet)" stroke-width="10"/>
    <path d="M92 132 L202 34 L312 132" fill="none" stroke="url(#garnet)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M126 132 L202 66 L278 132" fill="none" stroke="url(#stone)" stroke-width="10" stroke-linejoin="round"/>
    <rect x="178" y="151" width="48" height="40" fill="url(#stone)"/>
    <path d="M202 95 C211 78 232 79 238 95 C241 109 229 120 214 132 C199 120 187 109 190 95 C195 80 213 80 214 95 C215 80 233 80 238 95" fill="url(#garnet)"/>
  </g>

  <g fill="url(#stone)" font-family="Bitter, Georgia, serif" font-weight="700">
    <text x="338" y="218" font-size="84" letter-spacing="1">TRIANGLE</text>
    <text x="340" y="276" font-size="48" letter-spacing="3" fill="url(#garnet)">HOME DEFENSE</text>
  </g>

  <g fill="#d7c9b1" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="6">
    <text x="340" y="332">PROTECT  PREVENT  DEFEND</text>
  </g>

  <line x1="340" y1="360" x2="584" y2="360" stroke="#8f3030" stroke-width="2"/>
</svg>
